[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "celery-bittensor"
authors = [
  { name="Tomasz Żyźniewski", email="zyzniewski@gmail.com" },
]
description = "Celery's Bittensor Schedule"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "bittensor == 11.*",
    "celery >= 5.7.0, < 6.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/zyzniewski/celery-bittensor"
Issues = "https://github.com/zyzniewski/celery-bittensor/issues"

[project.entry-points."celery.beat_schedulers"]
celery_bittensor = "celery_bittensor.beat:PersistentScheduler"

[tool.hatch.version]
path = "src/celery_bittensor/version.py"

[dependency-groups]
dev = ["pytest>=8.0"]

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true
